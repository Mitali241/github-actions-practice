#workflow
#Should Have Name
name: Hello

#On tells when the workflow should run (Give identification by tab) 
on:
  workflow-dispatch:
  
#Jobs - tells what workflows should do do , there can be one or more than one jobs , hence we write jobs 
#job is an object so needs indentation
#Should be inside the workflow
jobs:
#1st job 
  say-hello:
  # Creats an ephermal container with ubuntu running 
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone 
        run: echo "Hello India!"

#steps
#should be inside the job 

#Actions
#should be inside the steps
